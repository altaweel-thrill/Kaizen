name: Deploy Kaizen Fitness to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public website files
        run: >-
          rsync -a --exclude='.git' --exclude='.github' --exclude='functions'
          --exclude='firebase.json' --exclude='firestore.rules' --exclude='docs'
          --exclude='tests'
          --exclude='scripts' --exclude='package.json' --exclude='package-lock.json'
          --exclude='server.js'
          --exclude='README.md' --exclude='node_modules' --exclude='.env*'
          --exclude='.firebase' --exclude='.firebaserc' --exclude='.secret*'
          --exclude='*.log' --exclude='.DS_Store'
          ./ "$RUNNER_TEMP/kaizen-site/"

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/kaizen-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
